name: Windows CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Matches the Visual Studio 2022 generator in CMakePresets.json.
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/prepare-release.ps1
      - name: Build and test native application
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration ${{ matrix.configuration }} -Smoke
      - name: Upload portable binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: CSP-Grayscale-Viewer-Native
          path: |
            build/native/Release/CSP-Grayscale-Viewer.exe
            build/native/Release/CSP-Grayscale-Viewer_Console.exe
            LICENSE
