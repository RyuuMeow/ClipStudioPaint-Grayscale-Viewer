name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -Smoke
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Package tested native binaries
        shell: pwsh
        run: ./scripts/package.ps1 -Installer
      - name: Save packages for manual runs
        uses: actions/upload-artifact@v4
        with:
          name: CSP-Grayscale-Viewer-Packages
          path: |
            Output/CSP-Grayscale-Viewer_Setup.exe
            build/native/CSP-Grayscale-Viewer-Native-Portable.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/CSP-Grayscale-Viewer_Setup.exe
            build/native/CSP-Grayscale-Viewer-Native-Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
