name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: pwsh
        run: ./scripts/test.ps1 -Configuration Release -Smoke
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Prepare portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          Copy-Item build/native/Release/CSP-Grayscale-Viewer.exe deploy/
          Copy-Item build/native/Release/CSP-Grayscale-Viewer_Console.exe deploy/
          Copy-Item LICENSE deploy/
          Compress-Archive -Path deploy/* -DestinationPath CSP-Grayscale-Viewer_Portable.zip
      - name: Compile installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Save packages for manual runs
        uses: actions/upload-artifact@v4
        with:
          name: CSP-Grayscale-Viewer-Packages
          path: |
            Output/CSP-Grayscale-Viewer_Setup.exe
            CSP-Grayscale-Viewer_Portable.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/CSP-Grayscale-Viewer_Setup.exe
            CSP-Grayscale-Viewer_Portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
